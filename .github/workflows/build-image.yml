name: Build & push image

# Firecrawl's nuq-postgres (Postgres 17 + pg_cron + NUQ schema) is published upstream as amd64-only,
# so it can't schedule on the Oracle ARM (aarch64) node. This rebuilds it for arm64 from Firecrawl's
# source and pushes to GHCR: ghcr.io/<owner>/nuq-postgres-docker:latest
on:
  push:
    branches: [main]
  # Build on PRs too, WITHOUT pushing. Without this a dependency bump here is
  # verified by nothing: the image was first built after merge, so a broken
  # base image or an unresolvable dependency landed on main before anyone
  # found out.
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # NEVER cancel a `main` build: it is the run that verifies what ships.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sparse-checkout only the nuq-postgres build context from Firecrawl (public repo).
      - name: Checkout Firecrawl nuq-postgres source
        uses: actions/checkout@v7
        with:
          repository: firecrawl/firecrawl
          sparse-checkout: apps/nuq-postgres
          sparse-checkout-cone-mode: false
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/nuq-postgres
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nuq-postgres-docker:latest
            ghcr.io/${{ github.repository_owner }}/nuq-postgres-docker:${{ github.sha }}
      # Auto-CD: tell muffin-deployment a fresh image is on GHCR so it redeploys the Swarm stack
      # (deploy.yml listens for repository_dispatch type=deploy). Needs a cross-repo PAT — the
      # built-in GITHUB_TOKEN can't dispatch to another repo.
      - name: Trigger deploy
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/muffin-deployment
          event-type: deploy
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
